name: Publish CopyManga to Docker Hub

on:
  push:
    branches:
      - feature/copymanga-source-browser
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify browsing and recovery behavior
        run: |
          python -m pip install httpx python-dotenv natsort fastapi beautifulsoup4 "cryptography>=42,<47"
          python -m unittest discover -s tests -v
      - name: Check Docker Hub credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Docker Hub publishing is waiting for DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.credentials.outputs.ready == 'true'
      - name: Prepare image tags
        if: steps.credentials.outputs.ready == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/copymanga-nasdownloader
          flavor: latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=preview,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=sha-${{ github.sha }}
      - name: Log in to Docker Hub
        if: steps.credentials.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        if: steps.credentials.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
