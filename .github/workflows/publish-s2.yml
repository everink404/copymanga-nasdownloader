name: Publish S2 download core preview

on:
  push:
    branches: [feature/download-core]
    paths:
      - 'download_core/**'
      - 'tests_core/**'
      - 'Dockerfile.s2'
      - 'requirements-s2.txt'
      - 'scripts/s2_smoke.py'
      - '.github/workflows/publish-s2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test download core and recovery
        run: |
          python -m pip install -r requirements-s2.txt
          python -m unittest discover -s tests_core -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.s2
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: |
            montequilla/copymanga-nasdownloader:s2-preview
            montequilla/copymanga-nasdownloader:s2-${{ github.sha }}
          build-args: |
            APP_VERSION=s2-preview
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=s2-preview
          cache-from: type=gha,scope=s2
          cache-to: type=gha,mode=max,scope=s2
      - name: Start and verify test container
        run: |
          docker run -d --name s2-smoke -e CMNAS_S2_FIXTURE=1 -p 18002:8000 montequilla/copymanga-nasdownloader:s2-${GITHUB_SHA}
          python scripts/s2_smoke.py http://127.0.0.1:18002
          docker restart s2-smoke
          python scripts/s2_smoke.py http://127.0.0.1:18002 --verify-existing
