name: Publish CopyManga image

on:
  push:
    branches:
      - fix/copymanga-rate-limit-recovery
      - feature/copymanga-source-browser
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-copymanga-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify recovery behavior
        run: |
          python -m pip install httpx python-dotenv natsort fastapi beautifulsoup4
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:copymanga-fix
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'feature/copymanga-source-browser' && 'browse-preview' || 'copymanga-fix' }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published container starts
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          trap 'docker logs cmnas-smoke; docker rm -f cmnas-smoke' EXIT
          docker run -d --name cmnas-smoke -p 127.0.0.1:18080:8000 "$IMAGE"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/ > /dev/null; then
              echo "Published image serves the WebUI successfully"
              exit 0
            fi
            sleep 2
          done
          exit 1
