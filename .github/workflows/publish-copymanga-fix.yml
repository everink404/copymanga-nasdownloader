name: Publish CopyManga image

on:
  push:
    branches:
      - fix/copymanga-rate-limit-recovery
      - feature/copymanga-source-browser
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-copymanga-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify recovery behavior
        run: |
          python -m pip install httpx python-dotenv natsort fastapi beautifulsoup4 "cryptography>=42,<47"
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=browse-preview,enable=${{ github.ref_name == 'feature/copymanga-source-browser' }}
            type=raw,value=copymanga-fix,enable=${{ github.ref_name == 'fix/copymanga-rate-limit-recovery' }}
            type=raw,value=sha-${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published container starts
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          trap 'docker logs cmnas-smoke; docker rm -f cmnas-smoke' EXIT
          docker run -d --name cmnas-smoke -p 127.0.0.1:18080:8000 "$IMAGE"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/ > /dev/null; then
              echo "Published image serves the WebUI successfully"
              exit 0
            fi
            sleep 2
          done
          exit 1
