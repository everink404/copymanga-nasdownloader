<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫画下载核心 · S2 测试</title><style>
body{font:16px/1.6 system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:0 20px;background:#f5f7fa;color:#1d2c3d}h1{font-size:26px}section,article{background:white;border:1px solid #dce3eb;border-radius:12px;padding:20px;margin:16px 0}button,select{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid #c2cedb;background:white;margin:4px;cursor:pointer}button.primary{background:#204e7c;color:white}progress{width:100%;height:14px}.muted{color:#5a697a}#error{color:#9b2727;white-space:pre-wrap}small{font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#174f83}</style>
<h1>漫画下载核心 · S2 测试</h1><p class="muted">离线样例用于验证下载、失败恢复和文件保存。真实漫画源与正式订阅界面在 S3 接入。</p>
<div id="health"></div><div id="error" role="alert"></div>
<section><h2>离线下载示例</h2><p>2 章，每章 3 页；图片在容器内生成，无需漫画账号。</p>
<label>下载范围 <select id="mode"><option value="all">全部章节</option><option value="future">只跟踪之后新增</option><option value="from">从第 2 章开始</option></select></label>
<label>测试场景 <select id="scenario"><option value="normal">正常下载</option><option value="failure">第 2 页首次失败（可重试）</option><option value="html">第 2 页返回网页（应拒绝打包）</option></select></label>
<button class="primary" id="add">预览并添加测试订阅</button><div id="preview"></div></section>
<section><h2>订阅</h2><div id="subscriptions"></div></section>
<section><h2>下载任务</h2><p class="muted">图片下载完后仍需打包和保存记录，章节才算完成。失败会保留已下载材料。</p><div id="tasks"></div></section>
<section><h2>已保存的 CBZ</h2><div id="artifacts"></div></section>
<script>
const $=id=>document.getElementById(id);const states={waiting:'排队',running:'下载中',retry_wait:'等待重试',completed:'已完成',failed:'失败',interrupted:'重启中断',stopped:'已停止',blocked:'已阻塞',recovery_required:'需要恢复'};
const escapeText=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const response=await fetch('/api/v1/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.message||'请求失败');return value}
async function action(path){try{$('error').textContent='';await api(path,{});await refresh()}catch(error){$('error').textContent=error.message}}
$('add').onclick=async()=>{try{$('error').textContent='';const mode=$('mode').value;let anchor=null;if(mode==='from'){const catalog=await api('catalog');anchor=catalog.items[1].chapter_key}const preview=await api('subscriptions/preview',{mode,anchor});$('preview').textContent=`完整目录 ${preview.chapter_keys.length} 章，范围已核对`;const options={preview_id:preview.id};if($('scenario').value==='failure')options.fail_page=2;if($('scenario').value==='html')options.html_page=2;await api('subscriptions',options);await refresh()}catch(error){$('error').textContent=error.message}};
async function refresh(){try{const [subscriptions,tasks,artifacts]=await Promise.all([api('subscriptions'),api('tasks'),api('artifacts')]);$('subscriptions').innerHTML=subscriptions.map(s=>`<article class="row"><div><b>${escapeText(s.title)}</b><br><small>${escapeText(s.source_id)} · ${escapeText(s.mode)}</small></div><button data-run="${escapeText(s.id)}">检查并下载</button></article>`).join('')||'<p class="muted">还没有订阅</p>';
$('tasks').innerHTML=tasks.slice().reverse().map(t=>`<article><div class="row"><b>${escapeText(t.title)} · ${escapeText(states[t.status]||t.status)}</b><small>${escapeText(t.phase)}</small></div><p>${escapeText(t.chapter)} · 本次已保存 ${t.chapters_done} / ${t.chapters_total??'?'} 章 · 图片 ${t.images_done} / ${t.images_total??'?'}</p><progress value="${t.images_done}" max="${t.images_total||1}"></progress><p><small>下载 ${(t.bytes_downloaded/1024).toFixed(1)} KiB · 复用 ${t.reused_images||0} 页${t.retry_at?' · 下次尝试 '+escapeText(new Date(t.retry_at*1000).toLocaleString()):''}</small></p>${t.error?'<p style="color:#9b2727">'+escapeText(t.error)+'</p>':''}${['failed','interrupted','stopped','recovery_required'].includes(t.status)?'<button data-retry="'+escapeText(t.id)+'">'+(t.status==='recovery_required'?'核对并修复':'重试')+'</button>':''}${['waiting','running','retry_wait','blocked'].includes(t.status)?'<button data-stop="'+escapeText(t.id)+'">完成当前章后停止</button>':''}</article>`).join('')||'<p class="muted">还没有下载任务</p>';
$('artifacts').innerHTML=artifacts.map(a=>`<p><a href="/api/v1/artifacts/${encodeURIComponent(a.id)}">${escapeText(a.name)}</a></p>`).join('')||'<p class="muted">还没有已完成文件</p>';
document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>action('subscriptions/'+b.dataset.run+'/run'));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>action('tasks/'+b.dataset.retry+'/retry'));document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>action('tasks/'+b.dataset.stop+'/stop'));
}catch(error){$('error').textContent=error.message}}
fetch('/health').then(r=>r.json()).then(h=>{$('health').textContent=h.version+' · '+h.mode;if(h.mode==='core')refresh()});setInterval(refresh,2000);
</script></html>
