<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画下载器</title>
<style>
:root{--ink:#243346;--muted:#69798a;--line:#e1e7ed;--paper:#fff;--bg:#f3f6f8;--accent:#116c74;--soft:#e7f3f1;--danger:#a83932}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:white;color:var(--ink)}button:hover{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:var(--danger)}input,select{border:1px solid #cdd7e0;border-radius:8px;padding:9px 12px;background:white;color:var(--ink);max-width:100%}a{color:var(--accent)}header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1200px)/2));gap:12px}header strong{font-size:21px;letter-spacing:1px}.brand{display:flex;align-items:center;gap:12px}.mark{width:35px;height:35px;background:var(--accent);color:white;border-radius:9px;display:grid;place-items:center;font-weight:700}.tag{background:var(--soft);color:var(--accent);border-radius:5px;font-size:12px;padding:3px 7px}main{max-width:1200px;margin:28px auto;padding:0 24px}nav{display:flex;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--line)}nav button{border:0;border-radius:8px 8px 0 0;background:none;padding:12px 20px;color:var(--muted)}nav button.active{background:white;color:var(--accent);box-shadow:inset 0 -3px var(--accent)}h1{font-size:25px;margin:0 0 5px}h2{font-size:19px;margin:0 0 14px}p{margin:8px 0 16px}.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:white;padding:18px;border:1px solid var(--line);border-radius:12px;margin:20px 0}.toolbar input[type=search]{flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px}.comic{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:linear-gradient(135deg,#d6e5e8,#e7ece8);color:#5c747e;text-align:center}.cover-wrap{border:0;padding:0;display:block;width:100%;border-radius:0}.comic-body{padding:13px}.comic h3{font-size:15px;margin:0 0 6px;line-height:1.5}.comic small{color:var(--muted)}.comic .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.comic .actions button{padding:5px 8px;font-size:13px}.pager{display:flex;justify-content:center;gap:16px;align-items:center;margin:28px 0}.empty{padding:60px 20px;text-align:center;background:white;border:1px dashed #cad5df;border-radius:12px;color:var(--muted)}.notice{padding:12px 16px;border-radius:8px;background:#fff5e1;color:#805e24;margin:14px 0}.error{background:#fcecea;color:#8d312c;padding:14px;border-radius:9px;margin-bottom:18px;white-space:pre-wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel,.task{background:white;border:1px solid var(--line);padding:20px;border-radius:12px;margin-bottom:15px}.task p{margin:8px 0}.task progress{width:100%;height:9px;accent-color:var(--accent)}.task small{color:var(--muted)}.task .actions{display:flex;gap:8px;flex-wrap:wrap}.state{font-size:12px;border-radius:20px;padding:3px 10px;background:var(--soft);color:var(--accent)}.state.failed,.state.recovery_required{background:#fcecea;color:#8d312c}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:900px;width:calc(100% - 28px);max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#1d2e4266}dialog .close{float:right}.detail-head{display:grid;grid-template-columns:155px 1fr;gap:24px;margin:16px 0}.detail-head img{border-radius:9px}.description{white-space:pre-line;max-height:180px;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.formgrid label{display:flex;flex-direction:column;gap:5px;font-size:14px}.full{grid-column:1/-1}#chapters{max-height:320px;overflow:auto;margin:15px 0}.chapter{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px;gap:15px}.chapter button{font-size:12px;white-space:nowrap}#anchor-note{color:var(--accent);font-size:13px}#preview-box{white-space:pre-wrap;padding:14px;background:var(--soft);border-radius:8px;margin:14px 0}.loading{color:var(--muted);padding:45px;text-align:center}.subgrid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}.subcard{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:14px}.subcard .cover{border-radius:7px}.subcard .comic-body{padding:0}.subcard h3{margin:0 0 5px}.subcard .actions{grid-column:1/-1}.settings-group{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}footer{color:var(--muted);font-size:12px;text-align:center;padding:28px}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #8bc4c3;outline-offset:2px}[hidden]{display:none!important}@media(max-width:600px){header{padding:0 18px}main{padding:0 15px;margin-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subgrid{grid-template-columns:1fr}.detail-head{grid-template-columns:90px 1fr;gap:15px}.formgrid{grid-template-columns:1fr}dialog{padding:18px}nav button{padding:10px 12px}.toolbar{padding:12px}.toolbar select{flex:1}.toolbar input[type=search]{flex-basis:100%}}
</style></head><body>
<header><div class="brand"><span class="mark">漫</span><strong>漫画下载器</strong><span class="tag">S3 候选</span></div><button id="settings-open">源设置</button></header>
<main><nav aria-label="主导航"><button class="active" data-tab="browse">漫画源</button><button data-tab="subscriptions">我的订阅</button><button data-tab="tasks">下载任务 <span id="task-count"></span></button></nav>
<div id="error" class="error" role="alert" hidden></div><div id="message" class="notice" role="status" hidden></div>
<section id="browse"><h1>发现漫画</h1><p class="muted">浏览资料和目录，选择下载范围后加入订阅。</p>
<form class="toolbar" id="search-form"><select id="source" aria-label="漫画源"></select><input id="query" type="search" placeholder="搜索漫画名称或作者" aria-label="搜索漫画"><select id="sort" aria-label="排序"><option value="updated">最近更新</option><option value="popular">热门</option></select><select id="status" aria-label="连载状态" hidden><option value="">全部状态</option><option value="0">连载中</option><option value="1">已完结</option><option value="2">短篇</option></select><button type="submit" class="primary">搜索 / 刷新</button></form>
<div class="row"><small id="browse-summary" class="muted"></small><button id="open-id">用作品 ID 打开</button></div><div id="comics" class="grid" style="margin-top:18px"></div><div class="pager"><button id="prev">上一页</button><span id="page-label">第 1 页</span><button id="next">下一页</button></div></section>
<section id="subscriptions" hidden><div class="row"><div><h1>我的订阅</h1><p class="muted">按漫画分组管理下载范围，暂停后保留已下载文件。</p></div><label><input type="checkbox" id="show-cancelled"> 显示已取消</label></div><div id="subscription-list" class="grid subgrid"></div></section>
<section id="tasks" hidden><div class="row"><div><h1>下载任务</h1><p class="muted">图片全部校验、CBZ 保存并写入记录后，章节才算完成。</p></div><select id="task-filter" aria-label="任务状态筛选"><option value="all">全部任务</option><option value="active">进行中</option><option value="failed">失败 / 待恢复</option><option value="completed">已完成</option></select></div><div id="task-list"></div><h2 style="margin-top:25px">已保存文件</h2><div id="artifact-list" class="panel"></div></section>
</main><footer id="version">漫画下载器 · 专注下载，不含在线阅读</footer>
<dialog id="detail"><button class="close" data-close="detail">关闭</button><div id="detail-content"></div><div id="detail-error" class="error" hidden></div>
<div id="range-controls" hidden><div class="row"><label>章节分组 <select id="group"></select></label><label>下载范围 <select id="mode"><option value="all">全部未下载章节</option><option value="future">只跟踪以后新增章节</option><option value="from">从指定章节开始（含该章）</option></select></label></div><p id="anchor-note">可在目录中选择起始章节。</p><div id="chapters"></div><div class="pager"><button id="chap-prev">上一页目录</button><span id="chap-page"></span><button id="chap-next">下一页目录</button></div><div id="preview-box" hidden></div><div class="row"><button id="preview" class="primary">预览下载范围</button><button id="confirm-sub" class="primary" hidden>确认添加订阅</button></div></div></dialog>
<dialog id="settings"><button class="close" data-close="settings">关闭</button><h2>漫画源设置</h2><p class="muted">每个源独立配置；密码、Token 和代理地址保存后不会回显。修改前先停止该源的活动任务。</p><label>选择漫画源 <select id="settings-source"></select></label><form id="settings-form" style="margin-top:20px"><div id="settings-fields" class="formgrid"></div><p id="settings-error" class="error" hidden></p><button class="primary" style="margin-top:20px">保存源配置</button></form></dialog>
<dialog id="direct"><button class="close" data-close="direct">关闭</button><h2>通过作品 ID 打开</h2><p class="muted">拷贝填写漫画链接中的 path_word；嬉皮填写作品链接 works/ 后第一段 ID。</p><form id="direct-form"><input id="direct-id" required aria-label="作品 ID" placeholder="作品 ID"><button class="primary">打开资料</button></form></dialog>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sources=[],page=1,hasMore=false,active='browse',current=null,anchor=null,preview=null,editing=null,cursor=null,cursorHistory=[],nextCursor=null,chapterPage=1,subs=[],tasks=[],artifacts=[],browseSequence=0;
const stateNames={waiting:'排队中',running:'下载中',retry_wait:'等待重试',completed:'已完成',failed:'失败',interrupted:'重启中断',stopped:'已停止',blocked:'已阻塞',recovery_required:'需要恢复'};
function showError(error,target='error'){const box=$(target);box.textContent=error.message||String(error);box.hidden=false}
function message(text){$('message').textContent=text;$('message').hidden=!text}
async function api(path,body,method){const response=await fetch('/api/v1/'+path,{method:method||(body===undefined?'GET':'POST'),headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok){const error=Error(value.message||'请求失败，请重试');error.code=value.error;if(value.retry_at)error.message+='\n可重试时间：'+new Date(value.retry_at*1000).toLocaleTimeString();throw error}return value}
function cover(comic){const url=typeof comic.cover==='string'&&comic.cover.startsWith('https://')?comic.cover:'';return `<img class="cover" src="${esc(url)}" alt="${esc(comic.title)}封面" referrerpolicy="no-referrer" loading="lazy">`}
function sourceName(id){return sources.find(s=>s.source_id===id)?.display_name||id}
function tab(name){active=name;for(const id of ['browse','subscriptions','tasks'])$(id).hidden=id!==name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name!=='browse')refresh()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
async function browse(){const sequence=++browseSequence;$('error').hidden=true;$('comics').innerHTML='<div class="loading">正在获取漫画列表…</div>';$('prev').disabled=true;$('next').disabled=true;const params=new URLSearchParams({source_id:$('source').value,q:$('query').value.trim(),page,sort:$('sort').value,status:$('status').hidden?'':$('status').value});try{const data=await api('browse?'+params);if(sequence!==browseSequence)return;hasMore=data.has_more;$('comics').innerHTML=data.items.map((c,i)=>`<article class="comic"><button class="cover-wrap" data-comic="${i}" aria-label="查看${esc(c.title)}资料">${cover(c)}</button><div class="comic-body"><h3>${esc(c.title)}</h3><small>${esc((c.authors||[]).join(' / ')||c.status||sourceName($('source').value))}</small></div></article>`).join('')||'<div class="empty">没有搜索结果，可修改关键词或清空筛选后重试。</div>';$('browse-summary').textContent=data.total!=null?`源站共 ${data.total} 部，当前显示 ${data.items.length} 部`:`本页 ${data.items.length} 部`;$('page-label').textContent='第 '+page+' 页';$('prev').disabled=page<=1;$('next').disabled=!hasMore;document.querySelectorAll('[data-comic]').forEach(b=>b.onclick=()=>openDetail($('source').value,data.items[+b.dataset.comic].comic_id));if(data.notice)message(data.notice);else message('')}catch(error){if(sequence!==browseSequence)return;$('comics').innerHTML='<div class="empty">暂时无法取得列表，请检查源设置和网络后重试。</div>';showError(error)}}
$('search-form').onsubmit=event=>{event.preventDefault();page=1;browse()};$('source').onchange=()=>{$('status').hidden=$('source').value!=='copymanga';$('status').value='';page=1;browse()};$('prev').onclick=()=>{if(page>1){page--;browse()}};$('next').onclick=()=>{if(hasMore){page++;browse()}};$('open-id').onclick=()=>$('direct').showModal();$('direct-form').onsubmit=e=>{e.preventDefault();$('direct').close();openDetail($('source').value,$('direct-id').value.trim())};
async function openDetail(source,id,sub=null){editing=sub;current={source,id};anchor=null;preview=null;cursor=null;cursorHistory=[];chapterPage=1;$('detail-content').innerHTML='<p class="loading">正在获取漫画资料…</p>';$('detail-error').hidden=true;$('range-controls').hidden=true;$('preview-box').hidden=true;$('confirm-sub').hidden=true;$('mode').value=sub?.mode||'all';if(!$('detail').open)$('detail').showModal();try{const comic=await api('comics/'+encodeURIComponent(source)+'/'+encodeURIComponent(id));current.comic=comic;$('detail-content').innerHTML=`<div class="detail-head"><div>${cover(comic)}</div><div><h2>${esc(comic.title)}</h2><p class="muted">${esc(sourceName(source))} · ${esc(comic.status||'状态未知')}</p><p>${esc((comic.authors||[]).join(' / '))}</p><p>${esc((comic.genres||[]).join(' · '))}</p></div></div><p class="description">${esc(comic.description||'暂无简介')}</p>${comic.notice?'<div class="notice">'+esc(comic.notice)+'</div>':''}`;if(!comic.groups?.length){showError(Error('未取得完整分组与目录，暂不能订阅。'),'detail-error');return}$('group').innerHTML=comic.groups.map(g=>`<option value="${esc(g.group_id)}">${esc(g.name)}</option>`).join('');if(sub)$('group').value=sub.group_id;$('group').disabled=!!sub;$('range-controls').hidden=false;$('confirm-sub').textContent=sub?'确认修改范围':'确认添加订阅';await chapters()}catch(error){showError(error,'detail-error')}}
async function chapters(){$('chapters').innerHTML='<p class="loading">正在获取目录…</p>';$('chap-next').disabled=true;$('chap-prev').disabled=true;const p=new URLSearchParams({source_id:current.source,comic_id:current.id,group_id:$('group').value});if(cursor!==null)p.set('cursor',cursor);try{const result=await api('chapter-page?'+p);nextCursor=result.next_cursor;$('chapters').innerHTML=result.items.map((c,i)=>`<div class="chapter"><span>${esc(c.title)}</span><button data-anchor="${i}">从此章开始</button></div>`).join('')||'<p class="muted">目录为空，不能订阅。</p>';$('chap-page').textContent='第 '+chapterPage+' 页'+(result.total!=null?' · 共 '+result.total+' 章':'');$('chap-prev').disabled=!cursorHistory.length;$('chap-next').disabled=!nextCursor;document.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=()=>{anchor=result.items[+b.dataset.anchor];$('mode').value='from';$('anchor-note').textContent='起始章节：'+anchor.title;invalidatePreview()})}catch(error){$('chapters').textContent='目录获取失败，未按无章节处理。';showError(error,'detail-error')}}
function invalidatePreview(){preview=null;$('preview-box').hidden=true;$('confirm-sub').hidden=true}
$('group').onchange=()=>{cursor=null;cursorHistory=[];chapterPage=1;anchor=null;invalidatePreview();chapters()};$('mode').onchange=invalidatePreview;$('chap-next').onclick=()=>{cursorHistory.push(cursor);cursor=nextCursor;chapterPage++;chapters()};$('chap-prev').onclick=()=>{cursor=cursorHistory.pop();chapterPage--;chapters()};
$('preview').onclick=async()=>{$('detail-error').hidden=true;$('preview').disabled=true;try{if($('mode').value==='from'&&!anchor)throw Error('请先在目录中选择起始章节');preview=await api('subscriptions/preview',{source_id:current.source,comic_id:current.id,group_id:$('group').value,mode:$('mode').value,anchor:$('mode').value==='from'?anchor.chapter_key:null});const count=preview.mode==='future'?0:preview.mode==='from'?preview.after_anchor.length:preview.chapter_keys.length;$('preview-box').textContent=`已核对完整目录：${preview.chapter_keys.length} 章。\n${preview.mode==='future'?'现有章节作为跟踪基准，之后出现的新章节才会下载。':'本次范围包含 '+count+' 章，已有有效 CBZ 的章节会跳过。'}`;$('preview-box').hidden=false;$('confirm-sub').hidden=false}catch(error){showError(error,'detail-error')}finally{$('preview').disabled=false}};
$('confirm-sub').onclick=async()=>{if(!preview)return;$('confirm-sub').disabled=true;try{if(editing)await api('subscriptions/'+editing.id+'/policy',{preview_id:preview.id},'PUT');else await api('subscriptions',{preview_id:preview.id});$('detail').close();message(editing?'下载范围已更新。':'订阅已添加，可在我的订阅中开始下载。');tab('subscriptions')}catch(error){showError(error,'detail-error')}finally{$('confirm-sub').disabled=false}};
async function action(path,body={},method){$('error').hidden=true;try{await api(path,body,method);await refresh()}catch(error){showError(error)}}
function renderSubs(){const items=subs.filter(s=>!s.cancelled||$('show-cancelled').checked);$('subscription-list').innerHTML=items.map((s,i)=>`<article class="comic subcard"><div>${cover(s)}</div><div class="comic-body"><h3>${esc(s.title)}</h3><small>${esc(sourceName(s.source_id))} · ${esc(s.group_id)}</small><p><span class="tag">${s.cancelled?'已取消':s.paused?'已暂停':{all:'全部章节',future:'只跟踪新增',from:'从指定章开始'}[s.mode]}</span></p><small>已校验 ${s.verified_chapters} 章</small></div><div class="actions">${s.cancelled?'<button data-restore="'+i+'">恢复订阅</button>':'<button class="primary" data-run="'+i+'" '+(s.paused?'disabled':'')+'>检查并下载</button><button data-pause="'+i+'">'+(s.paused?'恢复':'暂停')+'</button><button data-range="'+i+'">范围</button><button data-schedule="'+i+'">定时</button><button class="danger" data-cancel="'+i+'">取消订阅</button>'}</div></article>`).join('')||'<div class="empty">还没有订阅，先到漫画源选择一部漫画。</div>';for(const type of ['run','pause','range','cancel','restore','schedule'])document.querySelectorAll('[data-'+type+']').forEach(b=>b.onclick=()=>{const s=items[+b.dataset[type]];if(type==='run')action('subscriptions/'+s.id+'/run');if(type==='pause')action('subscriptions/'+s.id,{paused:!s.paused},'PATCH');if(type==='range')openDetail(s.source_id,s.comic_id,s);if(type==='cancel'&&confirm('取消订阅？已下载文件和完成记录会保留。'))action('subscriptions/'+s.id,{cancelled:true},'PATCH');if(type==='restore')action('subscriptions/'+s.id,{cancelled:false,paused:false},'PATCH');if(type==='schedule'){const value=prompt('自动检查间隔（小时），默认 120 小时：',s.interval_hours||120);if(value!==null&&value.trim())action('subscriptions/'+s.id,{interval_hours:Number(value)},'PATCH')}})}
function renderTasks(){const filter=$('task-filter').value;const list=tasks.filter(t=>filter==='all'||filter==='active'&&['waiting','running','retry_wait'].includes(t.status)||filter==='failed'&&['failed','blocked','interrupted','recovery_required'].includes(t.status)||filter==='completed'&&t.status==='completed');$('task-count').textContent=tasks.filter(t=>['waiting','running','retry_wait'].includes(t.status)).length||'';$('task-list').innerHTML=list.slice().reverse().map(t=>`<article class="task"><div class="row"><strong>${esc(t.title)}</strong><span class="state ${esc(t.status)}">${t.successor_job_id?'已转交重试':esc(stateNames[t.status]||t.status)}</span></div><p class="muted">${esc(sourceName(t.source_id))} · ${esc(t.phase)}${t.chapter?' · '+esc(t.chapter):''}</p><p>本次已保存 ${t.chapters_done} / ${t.chapters_total??'?'} 章 · 图片 ${t.images_done} / ${t.images_total??'?'}</p><progress value="${t.images_done}" max="${t.images_total||1}"></progress><p><small>${(t.bytes_downloaded/1024/1024).toFixed(2)} MB · 复用 ${t.reused_images||0} 页${t.status==='retry_wait'&&t.retry_at?' · 下次尝试 '+esc(new Date(t.retry_at*1000).toLocaleString()):''}${t.outcome==='no_updates'?' · 完整检查后确认没有待下载章节':''}</small></p>${t.error?'<div class="error">'+esc(t.error)+'</div>':''}<div class="actions">${!t.successor_job_id&&['failed','interrupted','stopped','recovery_required'].includes(t.status)?'<button data-retry="'+esc(t.id)+'">'+(t.status==='recovery_required'?'核对并修复':'重试')+'</button>':''}${['waiting','running','retry_wait','blocked','recovery_required'].includes(t.status)?'<button data-stop="'+esc(t.id)+'">完成当前章后停止</button>':''}</div></article>`).join('')||'<div class="empty">暂无此类下载任务。</div>';document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>action('tasks/'+b.dataset.retry+'/retry'));document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>action('tasks/'+b.dataset.stop+'/stop'));$('artifact-list').innerHTML=artifacts.map(a=>`<p><a href="/api/v1/artifacts/${encodeURIComponent(a.id)}">${esc(a.name)}</a></p>`).join('')||'<span class="muted">暂无已完成文件。</span>'}
async function refresh(){try{[subs,tasks,artifacts]=await Promise.all([api('subscriptions'),api('tasks'),api('artifacts')]);renderSubs();renderTasks()}catch(error){if(active!=='browse')showError(error)}}$('show-cancelled').onchange=renderSubs;$('task-filter').onchange=renderTasks;
function settingsFields(){const s=sources.find(s=>s.source_id===$('settings-source').value),config=s.settings;const fields=[['api_url','API 地址'],['web_url','官网地址'],...(s.source_id==='hipmh'?[['reader_url','章节资料地址'],['cover_url','封面地址'],['image_line','图片线路']]:[]),['proxy','HTTP 代理'],...(s.source_id==='copymanga'?[['username','账号'],['password','密码'],['token','Token（可选）']]:[]),['api_rate','每分钟 API 请求上限'],['image_rate','每分钟图片请求上限']];$('settings-fields').innerHTML=fields.map(([name,label])=>name==='image_line'?`<label>图片线路<select name="image_line"><option value="line1" ${config.image_line==='line1'?'selected':''}>线路一</option><option value="line2" ${config.image_line==='line2'?'selected':''}>线路二</option></select></label>`:`<label>${label}<input name="${name}" type="${['password','token','proxy'].includes(name)?'password':name.endsWith('_rate')?'number':'text'}" value="${esc(config[name]??'')}" ${name.endsWith('_rate')?'min="0" max="600"':''} placeholder="${config['has_'+name]?'已配置，留空保留':''}" autocomplete="off"></label>`).join('')+'<label class="full"><span><input type="checkbox" name="clear_proxy"> 清除已保存的代理</span></label><label class="full"><span><input type="checkbox" name="clear_account"> 清除已保存的账号凭据</span></label>';$('settings-error').hidden=true}
$('settings-open').onclick=()=>{$('settings-source').value=$('source').value;settingsFields();$('settings').showModal()};$('settings-source').onchange=settingsFields;$('settings-form').onsubmit=async event=>{event.preventDefault();const form=new FormData(event.target),values={};for(const [key,value] of form){if(key.startsWith('clear_'))continue;values[key]=key.endsWith('_rate')?Number(value):value}values.clear_secrets=[];if(form.has('clear_proxy'))values.clear_secrets.push('proxy');if(form.has('clear_account'))values.clear_secrets.push('username','password','token');try{const config=await api('sources/'+$('settings-source').value+'/settings',{values},'PUT');sources.find(s=>s.source_id===$('settings-source').value).settings=config;$('settings').close();message('源配置已保存。');browse()}catch(error){showError(error,'settings-error')}};
async function init(){try{sources=(await api('sources')).filter(s=>!s.hidden);const options=sources.map(s=>`<option value="${esc(s.source_id)}">${esc(s.display_name)}</option>`).join('');$('source').innerHTML=options;$('settings-source').innerHTML=options;const health=await fetch('/health').then(r=>r.json());$('version').textContent='漫画下载器 · '+health.version+' · '+health.revision.slice(0,7);await Promise.all([browse(),refresh()])}catch(error){showError(error)}}init();setInterval(()=>{if(active!=='browse')refresh()},3000);
</script></body></html>
